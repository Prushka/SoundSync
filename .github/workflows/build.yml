---
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch replaces a run still in progress, so releases never come out of
# order (the replaced run's commits are listed in the newer release's notes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Stamped into the binaries: the app shows "0.1.0 (build <n>, <commit>)".
  SOUNDSYNC_BUILD: ${{ github.run_number }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the commit
        shell: bash
        run: echo "SOUNDSYNC_COMMIT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --no-fail-fast
        env:
          # One test at a time: the engine tests each run several complete nodes in real time, and
          # in parallel on a runner's 3-4 cores they starve each other's audio threads (pinned to
          # one core, parallel runs failed 5 of 5, one at a time passed 3 of 3).
          RUST_TEST_THREADS: 1
          # Rust prints captured diagnostics only for failed tests.
          SS_DEBUG: 1
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: pwsh scripts/build-windows.ps1 -SkipTests
      - name: Upload (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: SoundSync-windows-x64
          path: dist/SoundSync-windows-x64.zip
          if-no-files-found: error

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/bundle-macos.sh
      # The ditto zip keeps the bundle's permissions and signature; artifact upload alone would not.
      - name: Upload (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: SoundSync-macos-universal
          path: dist/SoundSync-macos-universal.zip
          if-no-files-found: error

  # Every push to main that builds and passes on both systems becomes a GitHub release.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the notes list the commits since the previous release's tag
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release.sh
