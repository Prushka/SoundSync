[package]
name = "soundsync-audio"
description = "SoundSync audio I/O: WASAPI (Windows), CoreAudio (macOS), and a fake host for tests"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
soundsync-core.workspace = true
thiserror.workspace = true
serde.workspace = true

[target.'cfg(windows)'.dependencies]
wasapi.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-core.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-rs.workspace = true
objc2-core-audio.workspace = true
objc2-core-audio-types.workspace = true
libc = "0.2"
